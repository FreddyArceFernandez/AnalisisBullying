<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">

  <title> Clasificador de mensaje</title>
</head>

<body>

  <!-- Navbar -->

  <div class="container">
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Email Bullying Clasificador</a>
      </div>
    </nav>
  </div>


  <!-- Input form -->

  <div class="container">
    <h2 class="text-center mt-3">Bullying o No Bullying</h2>

    <form action="/" method="POST">
      <div class="form-floating">
        <textarea class="form-control" placeholder="Escribe tu mensaje aqui..." id="email" name="email" style="height: 100px"></textarea>
        <label for="email">Escribe tu mensaje aqui</label>
        <button class="w-100 btn btn-lg btn-primary">Probar</button>
      </div>

    </form>

  </div>



</body>

</html>
